apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: app1
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/SrinivasNairTP/ArgoCD-Basics-To-Production.git
    targetRevision: HEAD
    path: 04-PrivateRepo+SyncPruneSelfHeal/app1-config

  destination:
    server: https://kubernetes.default.svc
    namespace: app1-ns

  syncPolicy:
    automated:
      prune: true
      selfHeal: true